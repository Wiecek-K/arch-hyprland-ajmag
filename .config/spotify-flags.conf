# GPU sandbox crash after 2026-10-06 update (nvidia-580xx 580.178.04-4 / mesa 26.2.4):
# "GPU process isn't usable. Goodbye." without this flag.
--disable-gpu-sandbox
# Native Wayland instead of XWayland (ticket 49, 2026-10-15): Hyprland repaints only the damaged area, Intel GPU
# load with Canvas playing dropped from ~80-120% to ~25%. Revert: delete the two lines below, restart Spotify.
--enable-features=UseOzonePlatform,WaylandWindowDecorations
--ozone-platform=wayland
