# Ticket 36 (faza B, hyprland-lua-migration): rootless podman/distrobox containers
# (e.g. "pw" running Playwright workers) land in this slice. CPUWeight=idle makes
# them yield the CPU to everything else, so calls (Meet/Slack) and audio
# keep running under full load. Revert: delete this file, then
# `systemctl --user daemon-reload`.
[Slice]
CPUWeight=idle
