# Read portal backends AND their config from ~/.config/xdg-desktop-portal (ticket C36, 2026-11-13):
# symlinks to the system gtk/hyprland portals, our nautilus.portal and hyprland-portals.conf.
# With XDG_DESKTOP_PORTAL_DIR set, xdg-desktop-portal 1.22 looks for *-portals.conf only in that dir.
# A new system backend in /usr/share/xdg-desktop-portal/portals needs a new symlink there.
[Service]
Environment=XDG_DESKTOP_PORTAL_DIR=%h/.config/xdg-desktop-portal
