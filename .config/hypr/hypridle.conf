# General version (any machine). No dimming listener: brightnessctl without --class grabs the first device of any
# class (on the desktop the Wi-Fi LED phy0-led). A laptop keeps its own full copy of this file (dimming with
# `brightnessctl --class=backlight`, or DPMS off disabled on a driver that wedges the panel).

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/dpms-on.sh  # screen wake only; before_sleep_cmd already locked (DO NOT kill hyprlock!)
}

# === LOCKSCREEN ===
listener {
    timeout = 480                                 # 8min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# === TURN OFF SCREEN ===
listener {
    timeout = 600                                 # 10min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = ~/.config/hypr/scripts/dpms-on.sh
}

# === SUSPEND ===
listener {
    timeout = 2700                                # 45min
    on-timeout = systemctl suspend                # suspend pc
}
