[config.wallpaper]
# Tapetę ustawia wppicker.sh przez hyprpaper IPC; swww nie jest zainstalowany.
command = "swww"
arguments = ["img", "--transition-type", "any", "--transition-fps", "60"]
set = false

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = "kill -SIGUSR1 $(pidof kitty)"

# colors.conf zostaje dla hyprlocka i screenshot.sh (bez reloadu — hyprlock czyta przy starcie)
[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'

# Hyprland (Lua) ładuje colors.lua przez require → zapis pliku wyzwala autoreload, post_hook zbędny
[templates.hyprland_lua]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

# Ajmashell: Theme.qml obserwuje plik (FileView watchChanges) → post_hook zbędny
[templates.ajmashell]
input_path = '~/.config/matugen/templates/ajmashell-colors.json'
output_path = '~/.local/state/ajmashell/colors.json'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.cava]
input_path = '~/.config/matugen/templates/matugen-cava'
output_path = '~/.config/cava/config'
post_hook = "pkill -USR1 cava"

[templates.spicetify]
input_path = '~/.config/matugen/templates/spotify-colors.ini'
output_path = '~/.config/spicetify/Themes/text/color.ini'
# In the background: spicetify takes ~1–1.9 s and matugen waits for each hook before the next templates
# (gtk4, vesktop were written ~1 s late; measured 2026-10-01, ticket 19)
# Script, not plain `spicetify apply -n`: after a spicetify-cli/Spotify upgrade that only prints a hint and applies
# nothing (ticket 34); the script runs the repair and notifies on failure
post_hook = "setsid -f ~/.config/hypr/scripts/spicetify-apply.sh >/dev/null 2>&1"

[templates.vesktop]
input_path = '~/.config/matugen/templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/matugen.css'

[templates.zen]
input_path = '~/.config/matugen/templates/zen-colors.css'
output_path = '/home/ajmag/.zen/okor3zze.Default (release)/chrome/matugen-colors.css'
# Tells a running Zen to reload the file: /opt/zen-browser-bin/config.js listens on this socket (ticket 48).
# A connection is enough; no Zen = no socket, socat fails quietly and the next start reads the file anyway.
post_hook = "socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/ajmashell-zen.sock 2>/dev/null || true"

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '~/Storage/ajmag/Documents/Obsidian Vault/.obsidian/snippets/matugen-colors.css'

# Folder icons in the wallpaper colour (ticket 46): the script builds the icon theme overlay Ajmashell-Dark-a/-b
# from Colloid-Teal-Dark and switches gsettings to it (a running GTK app reloads icons only on a theme name change).
# In the background like spicetify: it takes ~0.35 s and matugen waits for each hook.
[templates.icon_accent]
input_path = '~/.config/matugen/templates/icon-accent.txt'
output_path = '~/.cache/ajmashell/icon-accent.txt'
post_hook = "setsid -f ~/.config/hypr/scripts/icon-overlay.py >/dev/null 2>&1"
